name: Frontend integrity
on:
  # Feature branches are validated by their PR. Avoid two concurrent browser
  # suites for each commit (push + pull_request) against separate disposable APIs.
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
        env:
          # Prisma 7 reads DATABASE_URL while generating the client. This is the disposable
          # PGlite address from the API tests. Nothing is listening, and it is not a real database.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:15439/postgres
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
      - name: Upload browser test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-log
          path: frontend/e2e-output.txt
          if-no-files-found: warn
