name: Backend integrity
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: verifi
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: verifi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verifi -d verifi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://verifi:test-only-password@localhost:5432/verifi_test
      TEST_DATABASE_URL: postgresql://verifi:test-only-password@localhost:5432/verifi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
